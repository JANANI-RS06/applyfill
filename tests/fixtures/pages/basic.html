<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<h1>Apply for Software Engineer</h1>
<form id="app" onsubmit="return false">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin"></div>
  <div><label for="resume">Resume/CV</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx"></div>
  <div><label for="country">Country</label>
    <select id="country" name="country"><option value="">Select...</option><option>Canada</option><option>United States</option></select>
  </div>
  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>
  <fieldset><legend>Will you now or in the future require sponsorship?</legend>
    <label><input type="radio" name="sponsor" value="yes"> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label>
  </fieldset>
  <section><h3>Education</h3>
    <label for="school">School</label><input id="school" name="school">
    <label for="degree">Degree</label>
    <select id="degree" name="degree"><option value="">Select...</option><option>High School</option><option>Bachelor's Degree</option><option>Master's Degree</option></select>
  </section>
  <div><label for="fav">What is your favorite programming paradigm?</label><input id="fav" name="fav"></div>
  <button type="submit" id="submit">Submit Application</button>
</form>
</body>
</html>
